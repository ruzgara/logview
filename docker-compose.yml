services:
  agent:
    image: ghcr.io/ruzgara/logview/agent:latest
    container_name: logview-agent
    restart: unless-stopped
    volumes:
      - "./test/:/log/"
    environment:
      - LOG_FILE=test.log
      - LOG_DIR=/log
      - PB_URL=http://app:8090
      - PB_TOKEN=

  app:
    image: ghcr.io/ruzgara/logview/app:latest
    container_name: logview-app
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - "./data:/pb/pb_data"